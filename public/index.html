<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Protected PDFs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>My Protected Documents</h1>
    <p>Click on a document to view it  (password required)</p>

    <div style="margin: 30px 0; display: grid; gap: 15px;">
      <a href="/pdfs/mydocument" class="pdf-link">My Document.pdf</a>
      <a href="/pdfs/secret-report" class="pdf-link">Secret Report.pdf</a>
      <a href="/pdfs/confidential" class="pdf-link">Confidential File.pdf</a>
    </div>
  </div>
</body>
</html>
