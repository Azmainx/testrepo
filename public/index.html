<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VS Code Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="vscode-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="title-bar">EXPLORER</div>
      <div class="tree">
        <div class="folder open">
          <span>▼ PROJECT</span>
          <div class="file" data-url="/files/README.md">README.md</div>
          <div class="file" data-url="/files/notes.txt">notes.txt</div>
          <div class="file locked" data-url="/secret-pdf">
            <span class="icon">Locked</span> secret-document.pdf
          </div>
        </div>
      </div>
    </div>

    <!-- Editor Area -->
    <div class="editor">
      <div class="tab-bar">
        <div class="tab active">secret-document.pdf</div>
      </div>
      <iframe id="pdf-viewer" src=""></iframe>
    </div>
  </div>

  <!-- Password Modal -->
  <div id="modal" class="modal">
    <div class="modal-box">
      <h3>Enter Password</h3>
      <input type="password" id="pass" placeholder="Password" autocomplete="off"/>
      <button id="unlockBtn">Unlock PDF</button>
      <p id="error" class="error">Wrong password</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
